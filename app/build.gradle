plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.dreamgallery.idoly.localify'
    compileSdk 36
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'io.github.dreamgallery.idoly.localify'
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName '0.5.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        release {
            def keyFile = System.getenv('IDOLY_KEYSTORE_FILE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('IDOLY_KEYSTORE_PASSWORD')
                keyAlias System.getenv('IDOLY_KEY_ALIAS')
                keyPassword System.getenv('IDOLY_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures { prefab true; buildConfig true }

    packaging {
        jniLibs {
            pickFirsts += ['**/libxdl.so', '**/libshadowhook.so']
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'validateSigningRelease') {
        task.doFirst {
            ['IDOLY_KEYSTORE_FILE', 'IDOLY_KEYSTORE_PASSWORD', 'IDOLY_KEY_ALIAS', 'IDOLY_KEY_PASSWORD'].each { name ->
                if (!System.getenv(name)) throw new GradleException("Release signing requires ${name}")
            }
        }
    }
}

dependencies {
    implementation 'com.bytedance.android:shadowhook:1.0.10'
    implementation 'io.github.hexhacking:xdl:2.1.1'
    compileOnly 'de.robv.android.xposed:api:82'
}
